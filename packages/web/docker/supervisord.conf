# ework-daemon: issue-driven AI bridge (polls ework, spawns opencode)
[program:ework-daemon]
directory=/app/ework-daemon
command=/usr/local/bin/bun run src/index.ts
autostart=true
autorestart=true
startretries=5
startsecs=2
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=DAEMON_ENV="production",DAEMON_PORT="3101",DAEMON_HOST="0.0.0.0",DAEMON_DB_PATH="/data/ework-daemon.db",GITEA_URL="%(ENV_GITEA_URL)s",GITEA_TOKEN="%(ENV_GITEA_TOKEN)s",GITEA_WEBHOOK_SECRET="%(ENV_GITEA_WEBHOOK_SECRET)s",BOT_USERNAME="%(ENV_BOT_USERNAME)s",BOT_TOKEN="%(ENV_BOT_TOKEN)s",OPENCODE_BINARY="%(ENV_OPENCODE_BINARY)s",OPENCODE_BASE_WORKDIR="%(ENV_OPENCODE_BASE_WORKDIR)s"

# ework: standalone multi-project issue tracker (Gitea-compat API + web UI)
[program:ework]
directory=/app/ework
command=/usr/local/bin/bun run src/index.ts
autostart=true
autorestart=true
startretries=5
startsecs=2
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=WORK_PORT="3002",WORK_HOST="0.0.0.0",WORK_TOKEN="%(ENV_WORK_TOKEN)s",WORK_COOKIE_SECRET="%(ENV_WORK_COOKIE_SECRET)s",WORK_OPERATOR_LOGIN="%(ENV_WORK_OPERATOR_LOGIN)s",WORK_DB_PATH="/data/ework.db",WORK_ATTACHMENT_ROOT="/data/attachments",WORK_OPENCODE_DB="/root/.local/share/opencode/opencode.db",WORK_FILE_ROOTS="/tmp,/data",WORK_DAEMON_BOT_LOGIN="%(ENV_BOT_USERNAME)s",WORK_DAEMON_WEBHOOK_URL="http://127.0.0.1:3101",WORK_DAEMON_WEBHOOK_SECRET="%(ENV_GITEA_WEBHOOK_SECRET)s"

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[supervisorctl]
serverurl=unix:/tmp/supervisor.sock

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface
