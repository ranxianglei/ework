name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    name: Type-check + unit tests (all packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install deps
        run: bun install --frozen-lockfile

      # aio's install tests run the real install flow → preflight requires
      # opencode on PATH. The runner has none.
      - name: Install opencode
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/sst/opencode/releases/latest/download/opencode-linux-x64.tar.gz -o /tmp/opencode.tgz
          mkdir -p /tmp/opencode-extract
          tar xzf /tmp/opencode.tgz -C /tmp/opencode-extract
          BIN="$(find /tmp/opencode-extract -name opencode -type f | head -1)"
          [[ -n "$BIN" ]] || { echo "opencode binary not found in tarball"; ls -R /tmp/opencode-extract; exit 1; }
          sudo install "$BIN" /usr/local/bin/opencode
          opencode --version

      - name: web — type-check + tests
        run: cd packages/web && bun run check && bun run test
      - name: daemon — type-check + tests
        run: cd packages/daemon && bun run check && bun run test
      - name: router — type-check + tests
        run: cd packages/router && bun run check && bun run test
      - name: mirror — type-check
        run: cd packages/mirror && bun run check
      - name: qq-bridge — type-check
        run: cd packages/qq-bridge && bun run check
      - name: chat — type-check
        run: cd packages/chat && bun run check
      - name: aio — type-check + tests + CLI entry
        run: cd packages/aio && bun run check && bun run test && bun run bin/ework-aio --help

  e2e:
    name: Docker E2E (install + lifecycle + migration)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # e2e-install.sh mounts the host's opencode binary into the test
      # container (preflight requires it). The runner has none, so install
      # from the sst/opencode GitHub release.
      - name: Install opencode
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/sst/opencode/releases/latest/download/opencode-linux-x64.tar.gz -o /tmp/opencode.tgz
          mkdir -p /tmp/opencode-extract
          tar xzf /tmp/opencode.tgz -C /tmp/opencode-extract
          BIN="$(find /tmp/opencode-extract -name opencode -type f | head -1)"
          [[ -n "$BIN" ]] || { echo "opencode binary not found in tarball"; ls -R /tmp/opencode-extract; exit 1; }
          sudo install "$BIN" /usr/local/bin/opencode
          opencode --version

      - name: Run E2E install test
        run: cd packages/aio && ./scripts/e2e-install.sh docker latest
        env:
          OPENCODE_HOST_BIN: /usr/local/bin/opencode

  docker-image:
    name: Docker image smoke (build + boot + web up)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # Build from the repo root exactly as documented in docs/quick-start.md
      # (context-independent build: everything installs from npm).
      - name: Build all-in-one image
        run: docker build -t ework-smoke -f docker/Dockerfile .

      # Boot with a fake model endpoint (aio's fake-llm-server) so the
      # entrypoint's provider generation path is exercised too.
      - name: Start fake model server
        run: |
          curl -fsSL https://bun.sh/install | bash >/dev/null 2>&1 || true
          export PATH="$HOME/.bun/bin:$PATH"
          nohup bun packages/aio/scripts/fake-llm-server.ts >/tmp/fake-llm.log 2>&1 &
          sleep 2
          curl -sf http://127.0.0.1:8401/health >/dev/null || curl -sf http://127.0.0.1:8401/ >/dev/null || { cat /tmp/fake-llm.log || true; }

      - name: Boot container
        run: |
          docker run -d --name ework-smoke \
            -p 13002:3002 -p 13101:3101 \
            --add-host host.docker.internal:host-gateway \
            -e WORK_TOKEN=smoketoken123 \
            -e WORK_COOKIE_SECRET=smokesecret123 \
            -e GITEA_WEBHOOK_SECRET=smokewebhook123 \
            -e WORK_LLM_BASE_URL=http://host.docker.internal:8401/v1 \
            -e WORK_LLM_MODEL=fake \
            ework-smoke

      - name: Wait for web + assert
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:13002/login || true)
            [[ "$code" == "200" ]] && break
            sleep 2
          done
          [[ "$code" == "200" ]] || { docker logs ework-smoke; exit 1; }
          echo "web is up"

      - name: Assert daemon + bootstrap artifacts
        run: |
          # Capture logs once and grep the FILE: piping `docker logs` into
          # `grep -q` races SIGPIPE under bash pipefail — grep exits at the
          # first match, the upstream writer dies with EPIPE, and the step
          # fails even though the assertion matched (observed as a flake on
          # 2026-09-17, run 35183741396).
          docker logs ework-smoke > /tmp/smoke.log 2>&1
          grep -q "supervisord" /tmp/smoke.log || { echo "supervisord not running"; exit 1; }
          grep -qE "ework-daemon (started|running)" /tmp/smoke.log \
            || grep -q "daemon" /tmp/smoke.log || { echo "daemon program missing from logs"; exit 1; }
          docker exec ework-smoke test -f /data/.bot-token || { echo "bot PAT not bootstrapped"; exit 1; }
          docker exec ework-smoke test -f /data/.config/opencode/opencode.json || { echo "opencode config not generated"; exit 1; }
          docker exec ework-smoke grep -q host.docker.internal /data/.config/opencode/opencode.json || { echo "provider baseURL wrong"; exit 1; }
          # All three supervised programs must reach RUNNING (router used to
          # FATAL on a fresh volume: SQLITE_CANTOPEN, no parent dirs).
          # NB: supervisord quotes program names in "spawned:" lines but not
          # in "success: <prog> entered RUNNING state".
          for prog in ework-web ework-daemon ework-router; do
            grep -q "success: ${prog} entered RUNNING state" /tmp/smoke.log \
              || { echo "${prog} never entered RUNNING state"; exit 1; }
          done
          ! grep -q "gave up: ework-router" /tmp/smoke.log || { echo "ework-router gave up (fatal loop)"; exit 1; }

      - name: Dump logs on failure
        if: failure()
        run: docker logs ework-smoke || true
